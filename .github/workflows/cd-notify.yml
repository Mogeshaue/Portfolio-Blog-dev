name: Build & Notify

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  notify:
    if: always() && needs.build.result == 'failure'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed build
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const title = `Build failure on ${branch}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const searchQuery = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Build failure on ${branch}"`;
            const { data: searchResults } =
              await github.rest.search.issuesAndPullRequests({
                q: searchQuery,
              });
            const existingIssue = searchResults.total_count > 0;

            if (existingIssue) {
              core.info('Open issue already exists for this failure.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'A build workflow run failed and needs attention.',
                '',
                `- Branch: ${branch}`,
                `- Commit: ${context.sha}`,
                `- Actor: @${context.actor}`,
                `- Run: ${runUrl}`,
              ].join('\n'),
            });
